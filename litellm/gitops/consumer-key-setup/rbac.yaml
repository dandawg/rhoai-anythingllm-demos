apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-key-setup
  namespace: demo-apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-key-setup
  namespace: demo-apps
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-key-setup
  namespace: demo-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-key-setup
subjects:
  - kind: ServiceAccount
    name: litellm-key-setup
    namespace: demo-apps
