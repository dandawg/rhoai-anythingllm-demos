apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: rhoai-models
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai-demos
spec:
  description: RHOAI model serving components (hardware profiles, model downloads, inference services)
  
  # Allow applications to deploy to any namespace
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  
  # Allow pulling from these Git repositories
  sourceRepos:
    - https://github.com/dandawg/rhoai-model-serving.git
    - https://github.com/dandawg/rhoai-anythingllm-demos.git
  
  # Allow all resource types (models may need cluster-wide resources)
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  
  # Namespace resource whitelist
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
