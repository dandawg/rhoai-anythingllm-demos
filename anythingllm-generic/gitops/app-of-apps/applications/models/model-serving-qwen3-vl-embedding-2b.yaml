apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-serving-qwen3-vl-embedding-2b
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: model-serving-qwen3-vl-embedding-2b
    app.kubernetes.io/part-of: rhoai-demos
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  project: rhoai-models
  
  source:
    repoURL: https://github.com/dandawg/rhoai-model-serving.git
    targetRevision: main
    path: platform/models/serving/qwen3-vl-embedding-2b/pvc
  
  destination:
    server: https://kubernetes.default.svc
  
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  
  ignoreDifferences:
    - group: serving.kserve.io
      kind: InferenceService
      jsonPointers:
        - /spec/predictor/model/args
        - /spec/predictor/model/resources
        - /spec/predictor/nodeSelector
        - /spec/predictor/tolerations
        - /spec/predictor/maxReplicas
        - /spec/predictor/minReplicas
        - /metadata/annotations
        - /metadata/labels
        - /status
    - group: serving.kserve.io
      kind: ServingRuntime
      jsonPointers:
        - /spec/containers/0/args
        - /spec/containers/0/image
        - /spec/containers/0/resources
        - /spec/containers/0/env
        - /metadata/annotations
        - /metadata/labels
        - /status
