apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-download-qwen3-vl-8b
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: model-download-qwen3-vl-8b
    app.kubernetes.io/part-of: rhoai-demos
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: rhoai-models
  
  source:
    repoURL: https://github.com/dandawg/rhoai-model-serving.git
    targetRevision: main
    path: platform/models/jobs/qwen3-vl-8b/pvc
  
  destination:
    server: https://kubernetes.default.svc
  
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
