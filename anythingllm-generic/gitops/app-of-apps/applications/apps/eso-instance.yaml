apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso-instance
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: eso-instance
    app.kubernetes.io/part-of: rhoai-demos
  annotations:
    argocd.argoproj.io/sync-wave: "31"
spec:
  project: rhoai-applications

  source:
    repoURL: https://github.com/dandawg/rhoai-anythingllm-demos.git
    targetRevision: main
    path: anythingllm-generic/platform/eso-instance

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
