apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: anythingllm
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: anythingllm
    app.kubernetes.io/part-of: rhoai-demos
  annotations:
    # Wave 46: runs after litellm-consumer-setup (wave 45) has written the
    # litellm-consumer Secret, so the pod starts with GENERIC_OPEN_AI_API_KEY present.
    argocd.argoproj.io/sync-wave: "46"
spec:
  project: rhoai-applications
  
  source:
    repoURL: https://github.com/dandawg/anythingllm-on-ocp.git
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values-rhoai.yaml
      values: |
        # Override with complete deployment values
        namespace: demo-apps
        
        env:
          - name: LLM_PROVIDER
            value: "generic-openai"
          - name: GENERIC_OPEN_AI_BASE_PATH
            # value: "http://qwen3-vl-8b-predictor.demo.svc.cluster.local:8080/v1"
            value: "http://litellm.demo-apps.svc:4000/v1"
          - name: GENERIC_OPEN_AI_MODEL_PREF
            value: "qwen3-vl-8b"
          - name: GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT
            value: "30000"
          - name: GENERIC_OPEN_AI_MAX_TOKENS
            value: "25000"
          - name: GENERIC_OPEN_AI_API_KEY
            valueFrom:
              secretKeyRef:
                name: litellm-consumer
                key: LITELLM_API_KEY
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: anythingllm-admin
                key: JWT_SECRET
          - name: VECTOR_DB
            value: "lancedb"
          - name: DISABLE_TELEMETRY
            value: "true"
          - name: NODE_TLS_REJECT_UNAUTHORIZED
            value: "0"
          - name: COMMUNITY_HUB_BUNDLE_DOWNLOADS_ENABLED
            value: "1"
        
        envFrom:
          - secretRef:
              name: model-api-tokens
        
        storage:
          size: 20Gi
          storageClassName: "gp3-csi"
        
        chromadb:
          enabled: false

        # gp3-csi (EBS) PVCs are ReadWriteOnce — only one node can attach the volume at a
        # time. The default RollingUpdate strategy starts a new pod before terminating the
        # old one, causing a permanent deadlock. Recreate terminates the old pod first.
        strategy:
          type: Recreate
  
  destination:
    server: https://kubernetes.default.svc
  
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      # Prevent ArgoCD from applying resources whose only diff is in ignoreDifferences
      # (e.g. PVC spec.volumeName set by Kubernetes after binding). Without this flag,
      # ignoreDifferences only suppresses the OutOfSync indicator but ArgoCD still
      # attempts the apply, which the API rejects as immutable — causing a sync loop.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  
  # Ignore OpenShift Route status field which is managed by the OpenShift router controller
  ignoreDifferences:
    - group: route.openshift.io
      kind: Route
      jsonPointers:
        - /status
    # Ignore PVC volumeName which is set by Kubernetes when the PVC binds to a PV
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
