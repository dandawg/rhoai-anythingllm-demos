apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso-secrets
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: eso-secrets
    app.kubernetes.io/part-of: rhoai-demos
  annotations:
    argocd.argoproj.io/sync-wave: "31"
spec:
  project: rhoai-applications
  
  source:
    repoURL: https://github.com/dandawg/rhoai-anythingllm-demos.git
    targetRevision: main
    path: anythingllm-generic/platform/eso-secrets
  
  destination:
    server: https://kubernetes.default.svc
  
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /spec/data/*/remoteRef/conversionStrategy
        - /spec/data/*/remoteRef/decodingStrategy
        - /spec/data/*/remoteRef/metadataPolicy
    - group: external-secrets.io
      kind: ClusterSecretStore
      jsonPointers:
        - /status
