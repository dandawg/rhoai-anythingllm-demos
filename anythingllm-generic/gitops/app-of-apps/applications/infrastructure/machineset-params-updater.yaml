apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: machineset-params-updater
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: machineset-params-updater
    app.kubernetes.io/part-of: rhoai-demos
    app.kubernetes.io/component: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: rhoai-infrastructure
  source:
    repoURL: https://github.com/dandawg/rhoai-anythingllm-demos.git
    targetRevision: main
    path: anythingllm-generic/infra/machineset-params-updater
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
