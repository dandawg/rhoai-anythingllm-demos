apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: anythingllm-bootstrap
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: anythingllm-bootstrap
    app.kubernetes.io/part-of: rhoai-demos
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  
  source:
    repoURL: https://github.com/dandawg/rhoai-anythingllm-demos.git
    targetRevision: main
    path: anythingllm-generic/gitops/app-of-apps
    directory:
      recurse: true
  
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  
  # Ignore differences in MachineSet Application parameters
  # These are automatically populated by the machineset-params-updater job
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: cpu-machineset-m6a-4xlarge
      jsonPointers:
        - /spec/source/helm/parameters
    - group: argoproj.io
      kind: Application
      name: gpu-machineset-g4dn-xlarge
      jsonPointers:
        - /spec/source/helm/parameters
    - group: argoproj.io
      kind: Application
      name: gpu-machineset-g6e-2xlarge
      jsonPointers:
        - /spec/source/helm/parameters
