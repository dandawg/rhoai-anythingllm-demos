apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: model-api-tokens
  namespace: demo-apps
  annotations:
    argocd.argoproj.io/sync-wave: "35"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: kubernetes-secrets
    kind: ClusterSecretStore
  
  target:
    name: model-api-tokens
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # API tokens for AnythingLLM
        GENERIC_OPEN_AI_API_KEY: "{{ .llmToken }}"
  
  data:
    # LLM token - RHOAI creates token secrets with pattern: default-name-<inferenceservice-name>-sa
    - secretKey: llmToken
      remoteRef:
        key: default-name-qwen3-vl-8b-sa
        property: token
