apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: model-api-tokens
  namespace: demo-apps
  annotations:
    argocd.argoproj.io/sync-wave: "31"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: kubernetes-secrets
    kind: ClusterSecretStore
  
  target:
    name: model-api-tokens
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # API tokens for AnythingLLM
        GENERIC_OPEN_AI_API_KEY: "{{ .llmToken }}"
        GENERIC_OPEN_AI_EMBEDDING_API_KEY: "{{ .embeddingToken }}"
  
  data:
    # LLM token - adjust secret name based on RHOAI token creation pattern
    # Common patterns: <inferenceservice-name>-sa, <inferenceservice-name>-token
    - secretKey: llmToken
      remoteRef:
        key: qwen3-vl-8b-sa
        property: token
    
    # Embedding token
    - secretKey: embeddingToken
      remoteRef:
        key: qwen3-vl-embedding-2b-sa
        property: token
