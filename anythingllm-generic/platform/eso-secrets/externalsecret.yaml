apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: model-api-tokens
  namespace: demo-apps
  annotations:
    argocd.argoproj.io/sync-wave: "35"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: kubernetes-secrets
    kind: ClusterSecretStore
  
  target:
    name: model-api-tokens
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # API tokens for AnythingLLM — one entry per deployed InferenceService
        QWEN3_VL_8B_API_KEY: "{{ .qwen3Vl8bToken }}"
        QWEN35_27B_FP8_API_KEY: "{{ .qwen3527bFp8Token }}"
  
  data:
    # RHOAI creates service-account token secrets with pattern: default-name-<inferenceservice-name>-sa
    - secretKey: qwen3Vl8bToken
      remoteRef:
        key: default-name-qwen3-vl-8b-sa
        property: token
    - secretKey: qwen3527bFp8Token
      remoteRef:
        key: default-name-qwen35-27b-fp8-sa
        property: token
