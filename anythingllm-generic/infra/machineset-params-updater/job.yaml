apiVersion: v1
kind: ServiceAccount
metadata:
  name: machineset-params-updater
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: machineset-params-updater
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: machineset-params-updater
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: machineset-params-updater
    namespace: openshift-gitops
roleRef:
  kind: Role
  name: machineset-params-updater
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: machineset-params-updater-configmap-reader
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames: ["cluster-info"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: machineset-params-updater-configmap-reader
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: machineset-params-updater
    namespace: openshift-gitops
roleRef:
  kind: ClusterRole
  name: machineset-params-updater-configmap-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: machineset-params-updater
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: machineset-params-updater
      restartPolicy: OnFailure
      containers:
      - name: update-params
        image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
        command:
        - /bin/bash
        - -c
        - |
          #!/bin/bash
          set -e
          
          echo "=============================================="
          echo "MachineSet Parameters Updater"
          echo "=============================================="
          echo ""
          
          # Step 1: Wait for cluster-info ConfigMap
          echo "Step 1: Waiting for cluster-info ConfigMap..."
          timeout=300
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if oc get configmap cluster-info -n openshift-machine-api &>/dev/null; then
              echo "  ✅ cluster-info ConfigMap found"
              break
            fi
            echo "  Waiting for cluster-discovery job... (${elapsed}s elapsed)"
            sleep 10
            elapsed=$((elapsed + 10))
          done
          
          if [ $elapsed -ge $timeout ]; then
            echo "  ❌ Timeout waiting for cluster-info ConfigMap"
            exit 1
          fi
          
          # Step 2: Read values from ConfigMap
          echo ""
          echo "Step 2: Reading cluster information..."
          CLUSTER_NAME=$(oc get configmap cluster-info -n openshift-machine-api -o jsonpath='{.data.clusterName}')
          REGION=$(oc get configmap cluster-info -n openshift-machine-api -o jsonpath='{.data.region}')
          AVAILABILITY_ZONE=$(oc get configmap cluster-info -n openshift-machine-api -o jsonpath='{.data.availabilityZone}')
          INFRA_ID=$(oc get configmap cluster-info -n openshift-machine-api -o jsonpath='{.data.infraID}')
          AMI_ID=$(oc get configmap cluster-info -n openshift-machine-api -o jsonpath='{.data.amiId}')
          
          echo "  Cluster Name: $CLUSTER_NAME"
          echo "  Region: $REGION"
          echo "  Availability Zone: $AVAILABILITY_ZONE"
          echo "  Infrastructure ID: $INFRA_ID"
          echo "  AMI ID: $AMI_ID"
          
          # Validate values
          if [ -z "$CLUSTER_NAME" ] || [ -z "$REGION" ] || [ -z "$AVAILABILITY_ZONE" ] || [ -z "$INFRA_ID" ] || [ -z "$AMI_ID" ]; then
            echo "  ❌ Error: Failed to retrieve all required values"
            exit 1
          fi
          
          # Step 3: Update ArgoCD Applications
          echo ""
          echo "Step 3: Updating ArgoCD Applications..."
          
          # List of applications to update
          APPLICATIONS=(
            "cpu-machineset-m6a-4xlarge"
            "gpu-machineset-g4dn-xlarge"
            "gpu-machineset-g6e-2xlarge"
          )
          
          for APP in "${APPLICATIONS[@]}"; do
            echo "  Processing $APP..."
            
            # Check if application exists
            if ! oc get application "$APP" -n openshift-gitops &>/dev/null; then
              echo "    ⚠️  Application not found, skipping..."
              continue
            fi
            
            # Update helm parameters using JSON patch
            oc patch application "$APP" -n openshift-gitops --type=json -p='[
              {"op": "replace", "path": "/spec/source/helm/parameters/0/value", "value": "'"$CLUSTER_NAME"'"},
              {"op": "replace", "path": "/spec/source/helm/parameters/1/value", "value": "'"$REGION"'"},
              {"op": "replace", "path": "/spec/source/helm/parameters/2/value", "value": "'"$AVAILABILITY_ZONE"'"},
              {"op": "replace", "path": "/spec/source/helm/parameters/3/value", "value": "'"$INFRA_ID"'"},
              {"op": "replace", "path": "/spec/source/helm/parameters/4/value", "value": "'"$AMI_ID"'"}
            ]'
            
            echo "    ✅ Updated $APP"
          done
          
          echo ""
          echo "=============================================="
          echo "✅ All parameters updated successfully!"
          echo "=============================================="
          echo ""
          echo "ArgoCD will now sync the MachineSet applications automatically."
          echo ""
