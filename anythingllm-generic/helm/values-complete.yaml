# Complete deployment values for AnythingLLM
# This file configures AnythingLLM with qwen3-vl-8b

namespace: demo-apps

# Environment variables for AnythingLLM
env:
  # LLM Provider - OpenAI API compatible mode
  - name: LLM_PROVIDER
    value: "generic-openai"
  - name: GENERIC_OPEN_AI_BASE_PATH
    value: "http://qwen3-vl-8b-predictor.demo.svc.cluster.local:8080/v1"
  - name: GENERIC_OPEN_AI_MODEL_PREF
    value: "qwen3-vl-8b"
  - name: GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT
    value: "30000"
  
  # Vector database - using built-in LanceDB
  - name: VECTOR_DB
    value: "lancedb"
  
  # Disable telemetry
  - name: DISABLE_TELEMETRY
    value: "true"
  
  # Disable TLS certificate validation for internal cluster services
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    value: "0"

  # Enable AnythingLLM Hub Agent Skills
  - name: ENABLE_ANYTHINGLLM_HUB_AGENT_SKILLS
    value: "1"

# Load API tokens from External Secrets synced secret
envFrom:
  - secretRef:
      name: model-api-tokens

# Storage configuration
storage:
  size: 20Gi
  storageClassName: ""  # Use default storage class

# ChromaDB is disabled - using built-in LanceDB instead
chromadb:
  enabled: false
