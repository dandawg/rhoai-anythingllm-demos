apiVersion: v1
kind: ConfigMap
metadata:
  name: anythingllm-signup-config
  namespace: {{ .Values.namespace }}
  labels:
    app: anythingllm-signup-app
  annotations:
    argocd.argoproj.io/sync-wave: "2"
{{- $externalUrl := .Values.anythingllmExternalUrl | default "" }}
{{- if not $externalUrl }}
{{- $route := lookup "route.openshift.io/v1" "Route" .Values.namespace (.Values.anythingllmRouteName | default "anythingllm") }}
{{- if and $route $route.spec $route.spec.host }}
{{- $externalUrl = printf "https://%s" $route.spec.host }}
{{- end }}
{{- end }}
data:
  USER_QUOTA: {{ .Values.userQuota | quote }}
  ANYTHINGLLM_URL: {{ .Values.anythingllmUrl | quote }}
  ANYTHINGLLM_EXTERNAL_URL: {{ $externalUrl | quote }}
  ANYTHINGLLM_ROUTE_NAME: {{ .Values.anythingllmRouteName | default "anythingllm" | quote }}
  SIGNUP_QWEN_CHAT_MODEL: {{ .Values.signupQwenChatModel | default "qwen3-vl-8b" | quote }}
  SIGNUP_NEMO_CHAT_MODEL: {{ .Values.signupNemoChatModel | default "nemotron-3-30b-a3b-fp8" | quote }}
  SIGNUP_CHAT_PROVIDER: {{ .Values.signupChatProvider | default "" | quote }}
