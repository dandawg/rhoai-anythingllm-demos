apiVersion: v1
kind: ServiceAccount
metadata:
  name: anythingllm-signup-app
  namespace: {{ .Values.namespace }}
  labels:
    app: anythingllm-signup-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anythingllm-signup-app-route-reader
  namespace: {{ .Values.namespace }}
  labels:
    app: anythingllm-signup-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    resourceNames: [{{ .Values.anythingllmRouteName | default "anythingllm" | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anythingllm-signup-app-route-reader
  namespace: {{ .Values.namespace }}
  labels:
    app: anythingllm-signup-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
subjects:
  - kind: ServiceAccount
    name: anythingllm-signup-app
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: anythingllm-signup-app-route-reader
  apiGroup: rbac.authorization.k8s.io
