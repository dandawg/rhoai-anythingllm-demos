apiVersion: v1
kind: Service
metadata:
  name: anythingllm-signup-app
  namespace: {{ .Values.namespace }}
  labels:
    app: anythingllm-signup-app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app: anythingllm-signup-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
